services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lostfound-db
    environment:
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound
      POSTGRES_DB: lostfound
    ports:
      - "5433:5432"
    volumes:
      - lostfound_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound -d lostfound"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lostfound-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      LF_DATABASE_URL: postgresql+psycopg://lostfound:lostfound@db:5432/lostfound
      LF_CONFIG_DIR: /app/config
      # LLM 默认零外部依赖；生产改成企业网关
      LF_LLM_PROVIDER: rule
      # 向量用本机 ONNX 多语言模型：无外部 API，能扛「说法完全不同」
      LF_EMBEDDING_PROVIDER: onnx
      # 默认 mpnet-base：实测 Recall@1 98.1%，优于 MiniLM(96.2%) 和 e5-large(86.8%)。
      # 想要更小的镜像可换回 MiniLM（-1.9 点，省 780MB）：
      #   LF_EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 docker compose up -d
      LF_EMBEDDING_MODEL: ${LF_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-mpnet-base-v2}
      LF_EMBEDDING_MODEL_VERSION: ${LF_EMBEDDING_MODEL_VERSION:-v1}
      LF_MODEL_CACHE: /models
      # 容器内跑评测脚本时指向自身
      LF_API_BASE: http://127.0.0.1:8000
    ports:
      - "8080:8000"
    volumes:
      - ./config:/app/config:ro
      - ./db:/app/db:ro
      # 评测脚本挂载进来：改完不用重建镜像就能重跑 benchmark
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs
      # 模型缓存持久化：换模型时不必重建镜像
      # （镜像里已烤好默认模型，首次挂载会自动复制进卷）
      - lostfound_models:/models

volumes:
  lostfound_pgdata:
  lostfound_models:
